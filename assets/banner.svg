<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Mohammad Hisham — Senior Software Engineer. Founder of 249apps.">
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="380" fill="#FFF6E5"/>

    <!-- colour blocks, one per shipped app -->
    <g transform="translate(772 -40) rotate(14)">
      <rect x="0"   y="-200" width="78" height="800" fill="#16A34A"/>
      <rect x="78"  y="-200" width="78" height="800" fill="#7C5CFF"/>
      <rect x="156" y="-200" width="78" height="800" fill="#14B8A6"/>
      <rect x="234" y="-200" width="78" height="800" fill="#F59E0B"/>
      <rect x="312" y="-200" width="78" height="800" fill="#2563EB"/>
      <rect x="390" y="-200" width="78" height="800" fill="#EF4466"/>
      <rect x="468" y="-200" width="400" height="800" fill="#0B1F45"/>
    </g>

    <text x="64" y="92" font-size="22" font-weight="700" letter-spacing="3" fill="#C2410C">HI, I'M</text>
    <text x="60" y="176" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#0B1F45">Mohammad</text>
    <text x="60" y="254" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#0B1F45">Hisham</text>

    <rect x="64" y="288" width="64" height="8" rx="4" fill="#F59E0B"/>
    <text x="64" y="334" font-size="24" font-weight="600" fill="#33405E">Senior Software Engineer · Founder of 249apps</text>
  </g>
</svg>
