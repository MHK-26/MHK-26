<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Mohammad Hisham — Senior Software Engineer. I build systems that run themselves.">
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="380" fill="#FFF6E5"/>

    <text x="64" y="92" font-size="22" font-weight="700" letter-spacing="3" fill="#C2410C">HI, I'M</text>
    <text x="60" y="176" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#0B1F45">Mohammad</text>
    <text x="60" y="254" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#0B1F45">Hisham</text>
    <rect x="64" y="288" width="64" height="8" rx="4" fill="#F59E0B"/>
    <text x="64" y="334" font-size="24" font-weight="600" fill="#33405E">Senior Software Engineer · I build systems that run themselves</text>

    <!-- the loop I engineer: design, build, automate, improve -->
    <ellipse cx="950" cy="190" rx="150" ry="104" fill="none" stroke="#0B1F45" stroke-opacity=".25" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle r="8" fill="#F59E0B">
      <animateMotion dur="9s" repeatCount="indefinite" path="M950,86 A150,104 0 1 1 949.9,86 Z"/>
    </circle>

    <text x="950" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#0B1F45">engineered</text>
    <text x="950" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#C2410C">end to end</text>

    <g font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#FFF6E5">
      <rect x="886" y="64"  width="128" height="44" rx="22" fill="#0B1F45"/><text x="950" y="92">DESIGN</text>
      <rect x="1036" y="168" width="128" height="44" rx="22" fill="#0B1F45"/><text x="1100" y="196">BUILD</text>
      <rect x="886" y="272" width="128" height="44" rx="22" fill="#F59E0B"/><text x="950" y="300" fill="#0B1F45">AUTOMATE</text>
      <rect x="736" y="168" width="128" height="44" rx="22" fill="#0B1F45"/><text x="800" y="196">IMPROVE</text>
    </g>
  </g>
</svg>
